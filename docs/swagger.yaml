        type: boolean
    type: object
  types.KubernetesServiceRule:
    properties:
      ClusterName:
        type: string
      Namespace:
        type: string
      ServiceName:
        type: string
    type: object
  types.ProtoPort:
    properties:
      Port:
        format: int32
        type: integer
      Protocol:
        type: string
    type: object
  types.RpaasInstanceRule:
    properties:
      Instance:
        type: string
      ServiceName:
        type: string
    type: object
  types.Rule:
    properties:
      Created:
        type: string
      Creator:
        type: string
      Destination:
