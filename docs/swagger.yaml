        type: object
      Removed:
        type: boolean
      RuleID:
        type: string
      RuleName:
        type: string
      Source:
        $ref: '#/definitions/types.RuleType'
    type: object
  types.RuleSyncData:
    properties:
      EndTime:
        type: string
      Error:
        type: string
      Removed:
        type: boolean
      StartTime:
        type: string
      Successful:
        type: boolean
      SyncResult:
        type: string
    type: object
  types.RuleSyncInfo:
    properties:
      EndTime:
        type: string
      Engine:
        type: string
      PingTime:
        type: string
      RuleID:
        type: string
      Running:
        type: boolean
      StartTime:
        type: string
      SyncID:
        type: string
      Syncs:
        items:
          $ref: '#/definitions/types.RuleSyncData'
        type: array
    type: object
  types.RuleType:
    properties:
      ExternalDNS:
