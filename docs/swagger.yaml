        $ref: '#/definitions/types.TsuruAppRule'
      TsuruJob:
        $ref: '#/definitions/types.TsuruJobRule'
    type: object
  types.ServiceInstance:
    properties:
      BaseRules:
        items:
          $ref: '#/definitions/types.ServiceRule'
        type: array
      BindApps:
        items:
          type: string
        type: array
      BindJobs:
        items:
          type: string
        type: array
      Creator:
        type: string
      EventID:
        type: string
      InstanceName:
        type: string
    type: object
  types.ServiceRule:
    properties:
