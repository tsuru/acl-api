name: Publish

on: [push, pull_request]

jobs:
  test:
    services:
      mongodb:
        image: mongo:4
        ports:
        - 27017:27017
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.20'
    - run: make test
    - run: make swagger-check

  publish:
    needs:
    - test
    name: Publish
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: actions/cache@v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - uses: Surgo/docker-smart-tag-action@v1.0.3
        id: smarttag
        with:
          docker_image: "tsuru/acl-api"
          default_branch: main
          tag_with_sha: "true"
      - uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v7.4.0
        with:
          file: ./Dockerfile
          push: true
          tags: ${{ steps.smarttag.outputs.tag }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          platforms: linux/amd64,linux/arm64
